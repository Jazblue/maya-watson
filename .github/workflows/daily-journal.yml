name: Daily Maya Journal Entry

on:
  schedule:
    # Runs at 5 PM UTC daily (adjust timezone as needed - 5pm London = 16:00 UTC in summer, 17:00 UTC in winter)
    - cron: '0 17 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  daily-journal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Generate journal entry
        id: generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/generate_journal_entry.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add journal.html
          git commit -m "Add journal entry for $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}